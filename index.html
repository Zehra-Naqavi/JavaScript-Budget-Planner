<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e0e0e; color: #e8e8e8; font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 40px 20px; }
  .back { position: fixed; top: 24px; left: 24px; font-size: 13px; color: #555; text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s; }
  .back:hover { color: #e8a0b4; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { margin-bottom: 32px; }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #555; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 500; color: #f0f0f0; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #666; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: #161616; border: 0.5px solid #2a2a2a; border-radius: 12px; padding: 28px; }
  .card h2 { font-size: 16px; font-weight: 500; color: #f0f0f0; margin-bottom: 20px; }
  .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .input-group label { font-size: 12px; color: #666; letter-spacing: 0.05em; text-transform: uppercase; }
  input[type="text"], input[type="number"], select {
    background: #1e1e1e; border: 0.5px solid #2e2e2e; border-radius: 8px;
    color: #f0f0f0; font-family: 'DM Sans', sans-serif; font-size: 15px;
    padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #e8a0b4; }
  select option { background: #1e1e1e; }
  .btn { width: 100%; padding: 12px; background: #e8a0b4; color: #0e0e0e; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #d4889e; }
  .btn-ghost { width: 100%; padding: 10px; background: transparent; color: #888; border: 0.5px solid #2e2e2e; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .btn-ghost:hover { border-color: #e8a0b4; color: #e8a0b4; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .summary-card { background: #161616; border: 0.5px solid #2a2a2a; border-radius: 12px; padding: 20px; text-align: center; }
  .summary-card .amount { font-size: 24px; font-weight: 500; font-family: monospace; margin-bottom: 4px; }
  .summary-card .slabel { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #555; }
  .income-val { color: #4a9a4a; }
  .expense-val { color: #e87070; }
  .remaining-val { color: #e8a0b4; }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card { background: #161616; border: 0.5px solid #2a2a2a; border-radius: 12px; padding: 24px; }
  .chart-card h2 { font-size: 15px; font-weight: 500; color: #f0f0f0; margin-bottom: 20px; }
  .expenses-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .expense-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; border: 0.5px solid #2e2e2e; border-radius: 8px; padding: 10px 14px; }
  .expense-item .exp-name { font-size: 14px; color: #ccc; }
  .expense-item .exp-cat { font-size: 11px; font-family: monospace; color: #555; }
  .expense-item .exp-amount { font-size: 14px; font-family: monospace; color: #e87070; }
  .expense-item .del-btn { background: none; border: none; color: #444; cursor: pointer; font-size: 16px; padding: 0 0 0 10px; transition: color 0.2s; }
  .expense-item .del-btn:hover { color: #e87070; }
  .empty-state { font-size: 13px; color: #444; text-align: center; padding: 20px; }
  .custom-cat-row { display: flex; gap: 8px; }
  .custom-cat-row input { flex: 1; }
  .custom-cat-row button { padding: 10px 14px; background: #1e1e1e; border: 0.5px solid #2e2e2e; border-radius: 8px; color: #888; cursor: pointer; font-size: 13px; white-space: nowrap; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
  .custom-cat-row button:hover { border-color: #e8a0b4; color: #e8a0b4; }
  .error { font-size: 12px; color: #e87070; margin-top: -8px; margin-bottom: 8px; min-height: 16px; }
  @media (max-width: 600px) {
    .grid, .charts-grid, .summary-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<a href="https://zehra-naqavi.github.io" class="back">← portfolio</a>

<div class="container">
  <div class="header">
    <p class="label">JavaScript · data visualisation</p>
    <h1>Budget Planner</h1>
    <p class="subtitle">Track your income and expenses. See where your money goes.</p>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <p class="amount income-val" id="totalIncome">£0.00</p>
      <p class="slabel">Income</p>
    </div>
    <div class="summary-card">
      <p class="amount expense-val" id="totalExpenses">£0.00</p>
      <p class="slabel">Expenses</p>
    </div>
    <div class="summary-card">
      <p class="amount remaining-val" id="remaining">£0.00</p>
      <p class="slabel">Remaining</p>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>💰 Add Income</h2>
      <div class="input-group">
        <label>Source</label>
        <input type="text" id="incomeSource" placeholder="e.g. Salary, Freelance" />
      </div>
      <div class="input-group">
        <label>Amount (£)</label>
        <input type="number" id="incomeAmount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <p class="error" id="incomeError"></p>
      <button class="btn" onclick="addIncome()">Add Income</button>
    </div>

    <div class="card">
      <h2>💸 Add Expense</h2>
      <div class="input-group">
        <label>Description</label>
        <input type="text" id="expenseName" placeholder="e.g. Weekly shop" />
      </div>
      <div class="input-group">
        <label>Category</label>
        <select id="expenseCategory">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="input-group">
        <label>Add custom category</label>
        <div class="custom-cat-row">
          <input type="text" id="customCat" placeholder="e.g. Gym" />
          <button onclick="addCustomCategory()">+ Add</button>
        </div>
      </div>
      <div class="input-group">
        <label>Amount (£)</label>
        <input type="number" id="expenseAmount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <p class="error" id="expenseError"></p>
      <button class="btn" onclick="addExpense()">Add Expense</button>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h2>Spending by Category</h2>
      <canvas id="barChart"></canvas>
    </div>
    <div class="chart-card">
      <h2>Budget Overview</h2>
      <canvas id="doughnutChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>📋 All Expenses</h2>
    <div class="expenses-list" id="expensesList">
      <p class="empty-state">No expenses added yet</p>
    </div>
    <button class="btn-ghost" onclick="clearAll()">Clear everything</button>
  </div>
</div>

<script>
  let income = [];
  let expenses = [];
  let barChart, doughnutChart;

  const COLORS = ['#e8a0b4','#a0c4e8','#a0e8b4','#e8d4a0','#c4a0e8','#e8a07a','#7ae8d4','#e8e8a0'];

  function initCharts() {
    const barCtx = document.getElementById('barChart').getContext('2d');
    const doughCtx = document.getElementById('doughnutChart').getContext('2d');

    barChart = new Chart(barCtx, {
      type: 'bar',
      data: { labels: [], datasets: [{ data: [], backgroundColor: COLORS, borderRadius: 6, borderSkipped: false }] },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#666', font: { family: 'DM Sans' } }, grid: { color: '#1e1e1e' } },
          y: { ticks: { color: '#666', font: { family: 'DM Sans' }, callback: v => '£' + v }, grid: { color: '#1e1e1e' } }
        }
      }
    });

    doughnutChart = new Chart(doughCtx, {
      type: 'doughnut',
      data: { labels: ['Remaining', 'Spent'], datasets: [{ data: [0, 0], backgroundColor: ['#4a9a4a', '#e87070'], borderWidth: 0, hoverOffset: 4 }] },
      options: {
        plugins: { legend: { labels: { color: '#888', font: { family: 'DM Sans' } } } },
        cutout: '65%'
      }
    });
  }

  function updateCharts() {
    const cats = {};
    expenses.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    barChart.data.labels = Object.keys(cats);
    barChart.data.datasets[0].data = Object.values(cats);
    barChart.data.datasets[0].backgroundColor = COLORS.slice(0, Object.keys(cats).length);
    barChart.update();

    const totalInc = income.reduce((s, i) => s + i.amount, 0);
    const totalExp = expenses.reduce((s, e) => s + e.amount, 0);
    const rem = Math.max(0, totalInc - totalExp);
    doughnutChart.data.datasets[0].data = [rem, totalExp];
    doughnutChart.update();
  }

  function updateSummary() {
    const totalInc = income.reduce((s, i) => s + i.amount, 0);
    const totalExp = expenses.reduce((s, e) => s + e.amount, 0);
    const rem = totalInc - totalExp;
    document.getElementById('totalIncome').textContent = '£' + totalInc.toFixed(2);
    document.getElementById('totalExpenses').textContent = '£' + totalExp.toFixed(2);
    const remEl = document.getElementById('remaining');
    remEl.textContent = '£' + Math.abs(rem).toFixed(2) + (rem < 0 ? ' over!' : '');
    remEl.style.color = rem < 0 ? '#e87070' : '#e8a0b4';
  }

  function renderExpenses() {
    const list = document.getElementById('expensesList');
    if (expenses.length === 0) { list.innerHTML = '<p class="empty-state">No expenses added yet</p>'; return; }
    list.innerHTML = expenses.map((e, i) => `
      <div class="expense-item">
        <div>
          <p class="exp-name">${e.name}</p>
          <p class="exp-cat">${e.category}</p>
        </div>
        <div style="display:flex;align-items:center">
          <p class="exp-amount">-£${e.amount.toFixed(2)}</p>
          <button class="del-btn" onclick="deleteExpense(${i})">×</button>
        </div>
      </div>
    `).join('');
  }

  function addIncome() {
    const source = document.getElementById('incomeSource').value.trim();
    const amount = parseFloat(document.getElementById('incomeAmount').value);
    const error = document.getElementById('incomeError');
    if (!source) { error.textContent = 'Please enter a source.'; return; }
    if (!amount || amount <= 0) { error.textContent = 'Please enter a valid amount.'; return; }
    error.textContent = '';
    income.push({ source, amount });
    document.getElementById('incomeSource').value = '';
    document.getElementById('incomeAmount').value = '';
    updateSummary();
    updateCharts();
  }

  function addExpense() {
    const name = document.getElementById('expenseName').value.trim();
    const category = document.getElementById('expenseCategory').value;
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const error = document.getElementById('expenseError');
    if (!name) { error.textContent = 'Please enter a description.'; return; }
    if (!amount || amount <= 0) { error.textContent = 'Please enter a valid amount.'; return; }
    error.textContent = '';
    expenses.push({ name, category, amount });
    document.getElementById('expenseName').value = '';
    document.getElementById('expenseAmount').value = '';
    renderExpenses();
    updateSummary();
    updateCharts();
  }

  function addCustomCategory() {
    const input = document.getElementById('customCat');
    const val = input.value.trim();
    if (!val) return;
    const select = document.getElementById('expenseCategory');
    const exists = Array.from(select.options).some(o => o.value.toLowerCase() === val.toLowerCase());
    if (!exists) {
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = val;
      select.appendChild(opt);
      select.value = val;
    }
    input.value = '';
  }

  function deleteExpense(index) {
    expenses.splice(index, 1);
    renderExpenses();
    updateSummary();
    updateCharts();
  }

  function clearAll() {
    if (!confirm('Clear everything?')) return;
    income = [];
    expenses = [];
    renderExpenses();
    updateSummary();
    updateCharts();
  }

  window.addEventListener('load', initCharts);
</script>

</body>
</html>
